name: Durable-write load

# The durable-write load tool (#118 stage 2): src/DotNext.Benchmarks.DurableWrite, see its README.md.
# - smoke: on pull requests and pushes that touch the WAL, Raft or the tool. A short matrix, then each injected
#   failure, which the oracles must catch (exit code 3). Correctness oracles only; no latency or memory thresholds.
# - baseline: manual only. The full matrix; the JSON report is uploaded as an artifact. Optional inputs (#123):
#   diagnostics (--diagnostics, plus an strace count of durability system calls on Linux), cells and repeat.
on:
  pull_request:
    branches: [fork]
    paths:
      - .github/workflows/durable-write-load.yml
      - src/DotNext.Benchmarks.DurableWrite/**
      - src/DotNext.Tests/Net/Cluster/Consensus/Raft/InProcess/SimulationHistory.cs
      - src/cluster/DotNext.Net.Cluster/**
      - src/DotNext.IO/**
      - src/DotNext.Threading/**
      - src/DotNext/**
      - src/DotNext.Unsafe/**
  push:
    branches: [fork]
    paths:
      - .github/workflows/durable-write-load.yml
      - src/DotNext.Benchmarks.DurableWrite/**
      - src/DotNext.Tests/Net/Cluster/Consensus/Raft/InProcess/SimulationHistory.cs
      - src/cluster/DotNext.Net.Cluster/**
      - src/DotNext.IO/**
      - src/DotNext.Threading/**
      - src/DotNext/**
      - src/DotNext.Unsafe/**
  workflow_dispatch:
    inputs:
      os:
        description: Runner
        required: true
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - windows-latest
      profile:
        description: Workload matrix
        required: true
        default: full
        type: choice
        options:
          - full
          - smoke
      memory:
        description: WAL memory management strategy
        required: true
        default: shared
        type: choice
        options:
          - shared
          - private
      diagnostics:
        description: Add the persist, lock and Raft breakdowns (--diagnostics) and, on Linux, an strace count of durability system calls
        required: false
        default: false
        type: boolean
      cells:
        description: Only the cells whose name contains one of these comma-separated dash-separated parts (--cells); empty for all
        required: false
        default: ''
        type: string
      repeat:
        description: Run the selected cells this many times and report the spread (--repeat, 1 to 20)
        required: false
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'
  PROJECT: src/DotNext.Benchmarks.DurableWrite/DotNext.Benchmarks.DurableWrite.csproj
  RESULTS_DIR: TestResults/durable-write

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: Smoke and oracle teeth
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build "$PROJECT" --configuration Release

      - name: Smoke run
        timeout-minutes: 8
        run: |
          set -o pipefail
          mkdir -p "$RESULTS_DIR"
          dotnet run --project "$PROJECT" --configuration Release --no-build -- \
            --profile smoke --max-duration 6 --work-dir "$RUNNER_TEMP/durable-write" \
            --out "$RESULTS_DIR/smoke.json" 2>&1 | tee "$RESULTS_DIR/smoke.log"

      # Each injected failure must be reported by the named oracle, with exit code 3.
      - name: Injected failures are caught
        timeout-minutes: 4
        run: |
          check() {
            local inject="$1" expected="$2" code=0
            dotnet run --project "$PROJECT" --configuration Release --no-build -- \
              --inject "$inject" --work-dir "$RUNNER_TEMP/durable-write" \
              --out "$RESULTS_DIR/inject-$inject.json" > "$RESULTS_DIR/inject-$inject.log" 2>&1 || code=$?
            tail -n 4 "$RESULTS_DIR/inject-$inject.log"
            local oracle
            oracle=$(jq -r '.violation.oracle // "none"' "$RESULTS_DIR/inject-$inject.json" 2>/dev/null || echo "no report")
            if [ "$code" -ne 3 ] || ! grep -qxE "$expected" <<< "$oracle"; then
              echo "::error title=Oracle missed an injected failure::--inject $inject exited with $code and oracle '$oracle'; expected exit 3 and oracle matching '$expected'"
              return 1
            fi
            echo "| \`$inject\` | $oracle | $(jq -r '.violation.message' "$RESULTS_DIR/inject-$inject.json") |" >> "$GITHUB_STEP_SUMMARY"
          }
          {
            echo "### Injected failures"
            echo ""
            echo "| Injection | Oracle | Report |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          check drop-applied 'apply order|committed-prefix agreement' || failed=1
          check reorder-applied 'apply order|committed-prefix agreement' || failed=1
          check non-durable-followers 'durability' || failed=1
          exit $failed

      - name: Upload reports
        if: ${{ always() && hashFiles('TestResults/durable-write/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durable-write-smoke-${{ github.run_attempt }}
          path: TestResults/durable-write/
          if-no-files-found: error
          retention-days: 14

      # The node data of a failed cell is kept for diagnosis: the logs, snapshots and state-machine files.
      - name: Upload node data
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durable-write-smoke-data-${{ github.run_attempt }}
          path: ${{ runner.temp }}/durable-write/
          if-no-files-found: ignore
          retention-days: 5

  baseline:
    name: Baseline (manual)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build "$PROJECT" --configuration Release

      - name: Baseline run
        timeout-minutes: 50
        env:
          IN_PROFILE: ${{ inputs.profile }}
          IN_MEMORY: ${{ inputs.memory }}
          IN_DIAGNOSTICS: ${{ inputs.diagnostics }}
          IN_CELLS: ${{ inputs.cells }}
          IN_REPEAT: ${{ inputs.repeat }}
        run: |
          set -o pipefail
          [[ "$IN_PROFILE" =~ ^(full|smoke)$ ]] || { echo "::error::profile must be full or smoke"; exit 1; }
          [[ "$IN_MEMORY" =~ ^(shared|private)$ ]] || { echo "::error::memory must be shared or private"; exit 1; }
          [[ "$IN_CELLS" =~ ^[A-Za-z0-9,-]*$ ]] || { echo "::error::cells must be letters, digits, commas and dashes"; exit 1; }
          [[ "$IN_REPEAT" =~ ^([1-9]|1[0-9]|20)$ ]] || { echo "::error::repeat must be 1 to 20"; exit 1; }
          args=(--profile "$IN_PROFILE" --memory "$IN_MEMORY" --max-duration 45 --work-dir "$RUNNER_TEMP/durable-write")
          [ "$IN_DIAGNOSTICS" = "true" ] && args+=(--diagnostics)
          [ -n "$IN_CELLS" ] && args+=(--cells "$IN_CELLS")
          [ "$IN_REPEAT" != "1" ] && args+=(--repeat "$IN_REPEAT")
          mkdir -p "$RESULTS_DIR"
          dotnet run --project "$PROJECT" --configuration Release --no-build -- \
            "${args[@]}" --out "$RESULTS_DIR/baseline.json" 2>&1 | tee "$RESULTS_DIR/baseline.log"

      # Durability system calls per acknowledged write (#123), counted by strace on the tool's own process tree: no
      # privileges needed beyond tracing a child. Each cell runs twice, for a short and a long measured window, and
      # the difference of the counts over the difference of the acknowledged writes cancels the start-up, recovery
      # audit and oracle checks. Counts are per process, so a 3-voter cell counts all three nodes.
      - name: Durability system calls (strace)
        if: ${{ inputs.diagnostics && runner.os == 'Linux' }}
        timeout-minutes: 10
        run: |
          set -o pipefail
          command -v strace > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq strace > /dev/null; }
          dll=src/DotNext.Benchmarks.DurableWrite/bin/Release/net10.0/DotNext.Benchmarks.DurableWrite.dll
          calls=fsync,fdatasync,msync,sync_file_range,rename,renameat,renameat2,unlink,unlinkat
          run() {
            local tag="$1" duration="$2"; shift 2
            strace -f -c -o "$RESULTS_DIR/strace-$tag.txt" -e trace="$calls" \
              dotnet "$dll" --profile full --warmup 1 --duration "$duration" --work-dir "$RUNNER_TEMP/durable-write" \
              --out "$RESULTS_DIR/strace-$tag.json" "$@" > "$RESULTS_DIR/strace-$tag.log" 2>&1
          }
          count() { awk -v s="$2" '$NF == s { print $4; found = 1 } END { if (!found) print 0 }' "$RESULTS_DIR/strace-$1.txt"; }
          acks() { jq '[.cells[].acknowledgedTotal] | add' "$RESULTS_DIR/strace-$1.json"; }
          {
            echo "### Durability system calls per acknowledged write (strace, differential)"
            echo ""
            echo "Device: \`$(findmnt -n -o SOURCE,FSTYPE,OPTIONS --target "$RUNNER_TEMP")\`"
            echo ""
            echo '```'
            lsblk -o NAME,TYPE,SIZE,ROTA,MODEL,FSTYPE,MOUNTPOINTS || true
            for queue in /sys/block/*/queue/write_cache; do echo "$queue: $(cat "$queue")"; done 2> /dev/null || true
            echo '```'
            echo ""
            echo "| Cell | Acks (short, long) | fsync | fdatasync | msync | rename* | unlink* |"
            echo "|---|---|---|---|---|---|---|"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for spec in "wal-append-128B-c1:--mode wal --sizes 128 --concurrency 1" \
                      "raft-closed-3v-128B-c1:--mode raft --voters 3 --sizes 128 --concurrency 1"; do
            cell="${spec%%:*}"; read -r -a extra <<< "${spec#*:}"
            run "$cell-short" 5 --cells "$cell" "${extra[@]}"
            run "$cell-long" 15 --cells "$cell" "${extra[@]}"
            a1=$(acks "$cell-short"); a2=$(acks "$cell-long")
            per() {
              local total1=0 total2=0 s
              for s in "$@"; do
                total1=$((total1 + $(count "$cell-short" "$s"))); total2=$((total2 + $(count "$cell-long" "$s")))
              done
              awk -v d="$((total2 - total1))" -v a="$((a2 - a1))" 'BEGIN { if (a > 0) printf "%.2f", d / a; else print "n/a" }'
            }
            echo "| $cell | $a1, $a2 | $(per fsync) | $(per fdatasync) | $(per msync) | $(per rename renameat renameat2) | $(per unlink unlinkat) |" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Summarize
        if: ${{ always() && hashFiles('TestResults/durable-write/baseline.json') != '' }}
        env:
          IN_OS: ${{ inputs.os }}
          IN_PROFILE: ${{ inputs.profile }}
          IN_MEMORY: ${{ inputs.memory }}
        run: |
          {
            echo "### Durable-write baseline ($IN_OS, $IN_PROFILE, $IN_MEMORY)"
            echo ""
            jq -r '"Revision `\(.environment.revision)`, \(.environment.os), \(.environment.cpuModel) x\(.environment.processorCount), \(.environment.fileSystem); exit code \(.exitCode)"' "$RESULTS_DIR/baseline.json"
            echo ""
            echo "| Cell | Completed/s | Ack p50 (us) | p99 | p99.9 | Stopped by |"
            echo "|---|---|---|---|---|---|"
            jq -r '.cells[] | "| \(.name) | \(.completedPerSecond) | \(.ackLatency.p50Us // "-") | \(.ackLatency.p99Us // "-") | \(.ackLatency.p999Us // "-") | \(.stoppedBy // "-") |"' "$RESULTS_DIR/baseline.json"
            if jq -e 'any(.cells[]; .diagnostics != null)' "$RESULTS_DIR/baseline.json" > /dev/null; then
              echo ""
              echo "#### Diagnostics (leader or single WAL)"
              echo ""
              echo "| Cell | Append cycles/ack | Entries/append cycle | Flush cycles/ack | Entries/flush cycle | Persist ms/ack | Max round gap (ms) | Device flushes/ack | Transitions |"
              echo "|---|---|---|---|---|---|---|---|---|"
              jq -r '.cells[] | select(.diagnostics != null) | . as $c
                | ([.nodes[] | select(.role == "leader" or .role == "single") | .node][0] // 0) as $l
                | [$c.diagnostics.persistCycles[] | select(.node == $l)] as $pc
                | ([$pc[] | select(.cause == "append")][0] // {}) as $a
                | ([$pc[] | select(.cause == "flush")][0] // {}) as $f
                | "| \($c.name) | \($a.cyclesPerAck // "-") | \($a.entriesPerCycle // "-") | \($f.cyclesPerAck // "-") | \($f.entriesPerCycle // "-") | \((($a.msPerAck // 0) + ($f.msPerAck // 0)) * 1000 | round / 1000) | \($c.diagnostics.raft.maxBroadcastGapMs // "-") | \($c.diagnostics.io.deviceFlushesPerAck // "-") | \([$c.diagnostics.raft.nodes[]? | .toLeader + .toCandidate + .toFollower] | add // "-") |"' "$RESULTS_DIR/baseline.json"
            fi
            if jq -e '.repeats != null' "$RESULTS_DIR/baseline.json" > /dev/null; then
              echo ""
              echo "#### Run-to-run spread"
              echo ""
              echo "| Cell | Rounds | Completed/s median (CV %, range %) | Ack p50 us median (CV %) | Ack p99 us median (CV %, range %) |"
              echo "|---|---|---|---|---|"
              jq -r '.repeats[] | "| \(.cell) | \(.rounds) | \(.completedPerSecond.median) (\(.completedPerSecond.cvPercent), \(.completedPerSecond.rangePercent)) | \(.ackP50Us.median) (\(.ackP50Us.cvPercent)) | \(.ackP99Us.median) (\(.ackP99Us.cvPercent), \(.ackP99Us.rangePercent)) |"' "$RESULTS_DIR/baseline.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: ${{ always() && hashFiles('TestResults/durable-write/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durable-write-baseline-${{ inputs.os }}-${{ inputs.profile }}-${{ inputs.memory }}-${{ github.run_attempt }}
          path: TestResults/durable-write/
          if-no-files-found: error
          retention-days: 30

      - name: Upload node data
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durable-write-baseline-data-${{ inputs.os }}-${{ inputs.profile }}-${{ inputs.memory }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/durable-write/
          if-no-files-found: ignore
          retention-days: 5
